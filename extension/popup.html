<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oh My Share</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
    }
    .header {
      background: linear-gradient(90deg, #ff5c7c, #5ce1d4);
      padding: 16px;
      text-align: center;
    }
    .header h1 {
      font-size: 18px;
      color: white;
      font-weight: bold;
    }
    .content {
      padding: 16px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab {
      flex: 1;
      padding: 8px;
      border: 2px solid #ddd;
      background: white;
      text-align: center;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }
    .tab.active {
      background: linear-gradient(90deg, #ff5c7c, #5ce1d4);
      color: white;
      border-color: transparent;
    }
    .tab:hover {
      opacity: 0.9;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      resize: vertical;
      margin-bottom: 12px;
    }
    textarea:focus {
      outline: none;
      border-color: #ff5c7c;
    }
    .options {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    select, input {
      flex: 1;
      padding: 8px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 12px;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #ff5c7c;
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #ff5c7c, #5ce1d4);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .result {
      display: none;
      margin-top: 16px;
      padding: 12px;
      background: white;
      border: 2px solid #5ce1d4;
      border-radius: 8px;
    }
    .result.show {
      display: block;
    }
    .result-url {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .result-url input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
    }
    .result-url button {
      width: auto;
      padding: 8px 12px;
      font-size: 12px;
    }
    .result-actions {
      display: flex;
      gap: 8px;
    }
    .result-actions button {
      flex: 1;
      font-size: 12px;
    }
    .result-actions button.secondary {
      background: #f5f5f0;
      color: #1a1a1a;
      border: 2px solid #ddd;
    }
    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      color: #666;
    }
    .loading.show {
      display: block;
    }
    .error {
      display: none;
      color: #ff5c7c;
      font-size: 12px;
      margin-top: 8px;
    }
    .error.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Oh My Share</h1>
  </div>
  
  <div class="content">
    <div class="tabs">
      <div class="tab active" data-tab="selection">Selection</div>
      <div class="tab" data-tab="code">Code</div>
    </div>
    
    <div id="selection-tab">
      <p style="font-size: 12px; margin-bottom: 12px; color: #666;">
        Select any HTML element on the page, then click "Share Selection"
      </p>
      <button id="shareSelection">Share Selection</button>
    </div>
    
    <div id="code-tab" style="display: none;">
      <textarea id="codeInput" placeholder="Paste your HTML or code here..."></textarea>
      <div class="options">
        <select id="language">
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="js">JavaScript</option>
          <option value="markdown">Markdown</option>
        </select>
        <input type="text" id="filename" placeholder="Filename (optional)">
      </div>
      <button id="shareCode">Share Code</button>
    </div>
    
    <div class="loading" id="loading">
      Uploading...
    </div>
    
    <div class="error" id="error"></div>
    
    <div class="result" id="result">
      <div class="result-url">
        <input type="text" id="shareUrl" readonly>
        <button id="copyBtn">Copy</button>
      </div>
      <div class="result-actions">
        <button id="openBtn">Open</button>
        <button id="newShare" class="secondary">New Share</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
